<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="WAM Instructor Lab — a six-hour active instructor-certification course for teaching the Working Actor Masterclass curriculum.">
  <title>WAM Instructor Lab</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to course content</a>
  <header class="site-header">
    <button class="brand" type="button" data-nav="dashboard" aria-label="WAM Instructor Lab dashboard">
      <span class="brand-mark" aria-hidden="true">WAM</span>
      <span class="brand-copy"><strong>Instructor Lab</strong><small>Teach the work. Keep it alive.</small></span>
    </button>
    <div class="header-stats" aria-label="Course status">
      <span><b id="header-level">Observer</b><small>level</small></span>
      <span><b id="header-xp">0 XP</b><small>earned</small></span>
      <span><b id="header-progress">0%</b><small>course</small></span>
    </div>
  </header>

  <nav id="main-nav" class="main-nav" aria-label="Primary navigation">
    <button class="nav-btn active" data-view="dashboard">Home</button>
    <button class="nav-btn" data-view="course">Course</button>
    <button class="nav-btn" data-view="mastery">Mastery</button>
    <button class="nav-btn" data-view="practice">Practice</button>
    <button class="nav-btn" data-view="reference">Lesson Plans</button>
    <button class="nav-btn" data-view="research">Why It Works</button>
    <button class="nav-btn" data-view="settings">Settings</button>
  </nav>

  <main id="app" tabindex="-1"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><div class="noscript">WAM Instructor Lab requires JavaScript for interactive practice, scoring, audio coaching, and saved progress.</div></noscript>
  <script src="./reference-data.js"></script>
  <script src="./course-data.js"></script>
  <script src="./mastery-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
